<script>
const SUPABASE_URL='https://bmwtrnosqosbkezdswcx.supabase.co', SUPABASE_KEY='sb_publishable_Ge88ZuNnqW89l0SMfw_mvQ_nY2BzpPr';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let session=null, profile=null, projects=[], reports=[], plans=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>(Number(n||0)*100).toFixed(1)+'%';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function toggleSignup(){document.getElementById('loginBox').classList.toggle('hidden');document.getElementById('signupBox').classList.toggle('hidden');document.getElementById('authMsg').textContent=''}
async function signup(){const n=fullName.value.trim(),e=signupEmail.value.trim(),p=signupPassword.value;if(!e||p.length<6)return authMsg.textContent='أدخل بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.';const r=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});authMsg.textContent=r.error?r.error.message:'تم إنشاء الحساب. تحقق من بريدك إذا طلب النظام ذلك، ثم سجل الدخول.'}
async function login(){const e=email.value.trim(),p=password.value;const r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)return authMsg.textContent=r.error.message;await boot(r.data.session)}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(s){session=s||session;if(!session){document.body.classList.remove('auth-pending');document.getElementById('login').classList.remove('hidden');document.getElementById('app').classList.add('hidden');return;}document.body.classList.add('auth-pending');const r=await db.from('user_profiles').select('*').eq('id',session.user.id).single();profile=r.data;if(profile?.role==='viewer'){await db.rpc('claim_first_admin');const rr=await db.from('user_profiles').select('*').eq('id',session.user.id).single();profile=rr.data||profile;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.body.classList.remove('auth-pending');userName.textContent=profile?.full_name||session.user.email;userRole.textContent=profile?.role||'viewer';window.__icvProfile=profile;await loadAll();const q=new URLSearchParams(location.search);const requestedPage=q.get('page');const requestedProject=q.get('project');if(requestedPage&&typeof showPage==='function'){showPage(requestedPage,document.querySelector('[data-page="'+requestedPage+'"]'));}else if(requestedProject&&typeof window.viewProject==='function'){window.viewProject(requestedProject);}else{showPage('dashboard',document.querySelector('[data-page=dashboard]'));}}
async function loadAll(){const [p,r,pl]=await Promise.all([db.from('projects').select('*,government_entities(name),companies(name)').order('serial_no'),db.from('quarterly_reports').select('*,projects(project_name)').order('created_at',{ascending:false}),db.from('local_content_plans').select('*,projects(project_name)').order('created_at',{ascending:false})]);projects=p.data||[];reports=r.data||[];plans=pl.data||[];window.projects=projects;window.reports=reports;window.plans=plans;renderDashboard();renderProjects();renderCompanies();renderReports();renderPlans();renderFollowups();renderAudit()}
function showPage(name,btn){
 if(name==='project'){
   const projectId=new URLSearchParams(location.search).get('project');
   const open=()=>{if(projectId&&typeof window.viewProject==='function'){window.viewProject(projectId);return true}return false};
   if(open())return;
   let tries=0;const timer=setInterval(()=>{if(open()||++tries>80)clearInterval(timer)},50);
   return;
 }
 document.querySelectorAll('[id^=page-]').forEach(e=>e.classList.add('hidden'));
 const target=document.getElementById('page-'+name);if(target)target.classList.remove('hidden');
 document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('active'));
 if(btn)btn.classList.add('active');
 const titles={dashboard:'لوحة التحكم',projects:'المشاريع',entities:'الجهات الحكومية',companies:'الشركات',reports:'التقارير الربع سنوية',plans:'خطط المحتوى المحلي',followups:'متابعة الموظفين',audit:'سجل التدقيق'};
 pageTitle.textContent=titles[name]||name;
}

(function(){
  let routingReady=false;
  let restoringRoute=false;

  function currentRoute(){
    const q=new URLSearchParams(location.search);
    return {page:q.get('page'),project:q.get('project')};
  }

  function writeRoute(route,replace){
    const q=new URLSearchParams();
    if(route.project) q.set('project',route.project);
    else q.set('page',route.page||'dashboard');
    const url=location.pathname+'?'+q.toString()+(location.hash||'');
    if(replace) history.replaceState({route:route},'',url);
    else history.pushState({route:route},'',url);
  }

  function routeFromUrl(){
    const route=currentRoute();
    restoringRoute=true;
    if(route.project && typeof window.viewProject==='function'){
      Promise.resolve(window.viewProject(route.project)).finally(function(){setTimeout(function(){restoringRoute=false;},0);});
      return;
    }
    const page=route.page||'dashboard';
    if(typeof window.showPage==='function'){
      const btn=document.querySelector('[data-page="'+page+'"]');
      Promise.resolve(window.showPage(page,btn||null)).finally(function(){setTimeout(function(){restoringRoute=false;},0);});
      return;
    }
    restoringRoute=false;
  }

  function installRouting(){
    if(window.__icvUrlRoutingInstalled)return;
    if(typeof window.showPage!=='function' || typeof window.viewProject!=='function')return;

    window.__icvUrlRoutingInstalled=true;
    const originalShowPage=window.showPage;
    const originalViewProject=window.viewProject;
    const originalBack=window.icvV2Back;

    window.showPage=function(page,btn){
      const result=originalShowPage.call(this,page,btn);
      if(routingReady && !restoringRoute) writeRoute({page:page},false);
      return result;
    };

    window.viewProject=async function(id){
      const result=await originalViewProject.call(this,id);
      if(routingReady && !restoringRoute) writeRoute({project:String(id)},false);
      return result;
    };

    if(typeof originalBack==='function'){
      window.icvV2Back=function(){
        const result=originalBack.apply(this,arguments);
        if(routingReady && !restoringRoute) writeRoute({page:'projects'},false);
        return result;
      };
    }

    window.addEventListener('popstate',function(){
      if(window.__icvProfile) routeFromUrl();
    });

    routingReady=true;
  }

  function waitForApp(){
    installRouting();
    if(!window.__icvUrlRoutingInstalled){
      setTimeout(waitForApp,150);
      return;
    }
    if(!window.__icvProfile || !document.getElementById('app') || document.getElementById('app').classList.contains('hidden')){
      setTimeout(waitForApp,150);
      return;
    }

    const route=currentRoute();
    if(route.project || route.page){
      routeFromUrl();
    }else{
      restoringRoute=true;
      Promise.resolve(window.showPage('dashboard',document.querySelector('[data-page="dashboard"]'))).finally(function(){
        restoringRoute=false;
        writeRoute({page:'dashboard'},true);
      });
    }
  }

  waitForApp();
})();
