<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICV New — منصة متابعة المحتوى المحلي</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0b1f33;--blue:#1565c0;--bg:#f4f7fb;--card:#fff;--muted:#667085;--line:#e5e7eb;--green:#138a52;--red:#c62828;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#071827,#12395a);padding:20px}.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px #0004}.logo{width:58px;height:58px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;margin-bottom:18px}.login h1{margin:0 0 8px}.muted{color:var(--muted);font-size:13px}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.btn{border:0;border-radius:10px;padding:10px 15px;background:#e9eef5;color:#172033;font-weight:700}.btn.primary{background:var(--blue);color:#fff}.btn.danger{background:#fee2e2;color:#991b1b}.link{border:0;background:none;color:var(--blue);font-weight:700;margin-top:12px}
.app{min-height:100vh;display:flex}.side{width:245px;background:var(--navy);color:#fff;padding:22px;position:fixed;top:0;bottom:0;right:0}.brand{font-weight:800;font-size:18px;line-height:1.5;margin-bottom:28px}.nav button{display:block;width:100%;text-align:right;background:transparent;color:#cbd5e1;border:0;padding:12px;border-radius:9px;margin:4px 0}.nav button.active,.nav button:hover{background:#173b5c;color:#fff}.side .logout{position:absolute;bottom:22px;right:22px;left:22px}
.main{margin-right:245px;width:calc(100% - 245px);padding:25px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0 0 5px}.pill{display:inline-block;background:#e8eef7;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:700;margin:2px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.card .label{font-size:13px;color:var(--muted)}.card .value{font-size:25px;font-weight:800;margin-top:8px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar h2{margin:0}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{background:#f8fafc;font-size:12px}td{font-size:13px}.status{font-weight:700}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--amber)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.metric{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;border-radius:18px;width:min(1050px,100%);max-height:90vh;overflow:auto;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.full{grid-column:1/-1}
.toast{position:fixed;left:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:10px;z-index:50}
@media(max-width:900px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:15px}.side .logout{position:static;margin-top:15px}.cards{grid-template-columns:1fr 1fr}.grid2,.form-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<section id="login" class="login"><div class="login-card">
<div class="logo">ICV</div><h1>ICV New</h1><div class="muted">منصة متابعة المشاريع والمحتوى المحلي</div>
<div id="loginBox"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">دخول</button><button class="link" onclick="toggleSignup()">إنشاء حساب جديد</button></div>
<div id="signupBox" class="hidden"><div class="field"><label>الاسم</label><input id="fullName"></div><div class="field"><label>البريد الإلكتروني</label><input id="signupEmail" type="email"></div><div class="field"><label>كلمة المرور</label><input id="signupPassword" type="password" minlength="6"></div><button class="btn primary" style="width:100%" onclick="signup()">إنشاء الحساب</button><button class="link" onclick="toggleSignup()">العودة للدخول</button></div>
<div id="authMsg" class="muted" style="margin-top:12px"></div></div></section>

<section id="app" class="app hidden">
<aside class="side"><div class="brand">ICV New<br><span class="muted" style="color:#9fb3c8">متابعة المحتوى المحلي</span></div>
<div class="nav">
<button data-page="dashboard" class="active" onclick="showPage('dashboard',this)">لوحة التحكم</button>
<button data-page="projects" onclick="showPage('projects',this)">المشاريع</button>
<button data-page="entities" onclick="showPage('entities',this)">الجهات الحكومية</button>
<button data-page="companies" onclick="showPage('companies',this)">الشركات</button>
<button data-page="reports" onclick="showPage('reports',this)">التقارير الربع سنوية</button>
<button data-page="plans" onclick="showPage('plans',this)">خطط المحتوى المحلي</button>
<button data-page="followups" onclick="showPage('followups',this)">متابعة الموظفين</button>
<button data-page="audit" onclick="showPage('audit',this)">سجل التدقيق</button>
</div><button class="btn logout" onclick="logout()">تسجيل الخروج</button></aside>
<main class="main"><div class="top"><div><h1 id="pageTitle">لوحة التحكم</h1><div class="muted">بيانات مباشرة من ICV New</div></div><div><span id="userName" class="pill"></span><span id="userRole" class="pill"></span></div></div>
<div id="page-dashboard"></div><div id="page-projects" class="hidden"></div><div id="page-entities" class="hidden"></div><div id="page-companies" class="hidden"></div><div id="page-reports" class="hidden"></div><div id="page-plans" class="hidden"></div><div id="page-followups" class="hidden"></div><div id="page-audit" class="hidden"></div>
</main></section><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://bmwtrnosqosbkezdswcx.supabase.co', SUPABASE_KEY='sb_publishable_Ge88ZuNnqW89l0SMfw_mvQ_nY2BzpPr';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); let session=null, profile=null, projects=[], reports=[], plans=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const pct=n=>(Number(n||0)*100).toFixed(1)+'%';
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2500)}
function toggleSignup(){document.getElementById('loginBox').classList.toggle('hidden');document.getElementById('signupBox').classList.toggle('hidden');document.getElementById('authMsg').textContent=''}
async function signup(){const n=fullName.value.trim(),e=signupEmail.value.trim(),p=signupPassword.value;if(!e||p.length<6)return authMsg.textContent='أدخل بريدًا صحيحًا وكلمة مرور من 6 أحرف على الأقل.';const r=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});authMsg.textContent=r.error?r.error.message:'تم إنشاء الحساب. تحقق من بريدك إذا طلب النظام ذلك، ثم سجل الدخول.'}
async function login(){const e=email.value.trim(),p=password.value;const r=await db.auth.signInWithPassword({email:e,password:p});if(r.error)return authMsg.textContent=r.error.message;await boot(r.data.session)}
async function logout(){await db.auth.signOut();location.reload()}
async function boot(s){session=s||session;if(!session)return;const r=await db.from('user_profiles').select('*').eq('id',session.user.id).single();profile=r.data;if(profile?.role==='viewer'){await db.rpc('claim_first_admin');const rr=await db.from('user_profiles').select('*').eq('id',session.user.id).single();profile=rr.data||profile;}document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');userName.textContent=profile?.full_name||session.user.email;userRole.textContent=profile?.role||'viewer';await loadAll();showPage('dashboard',document.querySelector('[data-page=dashboard]'))}
async function loadAll(){const [p,r,pl]=await Promise.all([db.from('projects').select('*,government_entities(name),companies(name)').order('serial_no'),db.from('quarterly_reports').select('*,projects(project_name)').order('created_at',{ascending:false}),db.from('local_content_plans').select('*,projects(project_name)').order('created_at',{ascending:false})]);projects=p.data||[];reports=r.data||[];plans=pl.data||[];renderDashboard();renderProjects();renderEntities();renderCompanies();renderReports();renderPlans();renderFollowups();renderAudit()}
function showPage(name,btn){document.querySelectorAll('[id^=page-]').forEach(e=>e.classList.add('hidden'));document.getElementById('page-'+name).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(e=>e.classList.remove('active'));if(btn)btn.classList.add('active');const titles={dashboard:'لوحة التحكم',projects:'المشاريع',entities:'الجهات الحكومية',companies:'الشركات',reports:'التقارير الربع سنوية',plans:'خطط المحتوى المحلي',followups:'متابعة الموظفين',audit:'سجل التدقيق'};pageTitle.textContent=titles[name]}
function renderDashboard(){const value=projects.reduce((a,p)=>a+Number(p.total_project_value||0),0),lc=projects.reduce((a,p)=>a+Number(p.total_local_content||0),0),sp=projects.reduce((a,p)=>a+Number(p.total_spend||0),0),bad=projects.filter(p=>p.made_in_oman_status==='غير مستوفي'||p.sme_10_status==='غير مستوفي').length;document.getElementById('page-dashboard').innerHTML='<div class="cards"><div class="card"><div class="label">إجمالي المشاريع</div><div class="value">'+projects.length+'</div></div><div class="card"><div class="label">قيمة المشاريع</div><div class="value">'+money(value)+'</div></div><div class="card"><div class="label">إجمالي المحتوى المحلي</div><div class="value">'+money(lc)+'</div></div><div class="card"><div class="label">نسبة المحتوى المحلي من الصرف</div><div class="value">'+pct(sp?lc/sp:0)+'</div></div></div><div class="grid2"><div class="panel"><h2>ملخص المشاريع</h2><div class="metric"><span>قيد التنفيذ</span><b>'+projects.filter(p=>p.project_status==='قيد التنفيذ').length+'</b></div><div class="metric"><span>غير مستوفي</span><b class="bad">'+bad+'</b></div><div class="metric"><span>التقارير المستلمة</span><b>'+projects.reduce((a,p)=>a+Number(p.received_reports||0),0)+'</b></div></div><div class="panel"><h2>آخر المشاريع</h2>'+projects.slice(0,5).map(p=>'<div class="metric"><span>'+esc(p.project_name)+'</span><b>'+pct(Number(p.progress_pct||0)/100)+'</b></div>').join('')+'</div></div>'}
function renderProjects(){document.getElementById('page-projects').innerHTML='<div class="panel"><div class="toolbar"><h2>المشاريع</h2><div class="actions"><input id="ps" class="search" style="width:280px" placeholder="بحث..." oninput="filterProjects()"><button class="btn" onclick="exportProjects()">تصدير Excel</button><button class="btn primary" onclick="openProject()">إضافة مشروع</button></div></div><div class="table-wrap"><table><thead><tr><th>م</th><th>المشروع</th><th>الجهة</th><th>القيمة</th><th>الإنجاز</th><th>المحتوى المحلي</th><th>الحالة</th><th></th></tr></thead><tbody id="projectRows"></tbody></table></div></div>';drawProjectRows(projects)}
function drawProjectRows(a){projectRows.innerHTML=a.map(p=>'<tr><td>'+esc(p.serial_no)+'</td><td><b>'+esc(p.project_name)+'</b></td><td>'+esc(p.government_entities?.name)+'</td><td>'+money(p.total_project_value)+'</td><td>'+Number(p.progress_pct||0).toFixed(1)+'%</td><td>'+money(p.total_local_content)+'</td><td class="status '+(p.project_status==='قيد التنفيذ'?'warn':'')+'">'+esc(p.project_status)+'</td><td><button class="btn" onclick="viewProject(\''+p.id+'\')">عرض</button></td></tr>').join('')}
function filterProjects(){const q=ps.value.toLowerCase();drawProjectRows(projects.filter(p=>(p.project_name||'').toLowerCase().includes(q)||(p.government_entities?.name||'').toLowerCase().includes(q)))}
function viewProject(id){const p=projects.find(x=>x.id===id);modal.innerHTML='<div class="modal-card"><div class="modal-head"><h2>'+esc(p.project_name)+'</h2><button class="close" onclick="closeModal()">×</button></div><div class="grid2"><div class="panel"><div class="metric"><span>الجهة</span><b>'+esc(p.government_entities?.name)+'</b></div><div class="metric"><span>القيمة</span><b>'+money(p.total_project_value)+'</b></div><div class="metric"><span>الإنجاز</span><b>'+Number(p.progress_pct||0).toFixed(1)+'%</b></div><div class="metric"><span>إجمالي الصرف</span><b>'+money(p.total_spend)+'</b></div></div><div class="panel"><div class="metric"><span>المحتوى المحلي</span><b>'+money(p.total_local_content)+'</b></div><div class="metric"><span>نسبة المحتوى/الصرف</span><b>'+pct(p.local_content_spend_pct)+'</b></div><div class="metric"><span>نسبة المحتوى/قيمة المشروع</span><b>'+pct(p.local_content_project_pct)+'</b></div><div class="metric"><span>SME</span><b>'+pct(p.sme_pct)+'</b></div></div></div><div class="panel" style="margin-top:15px"><h3>ملاحظات</h3><p>'+esc(p.notes)+'</p></div></div>';modal.classList.remove('hidden')}
function openProject(){modal.innerHTML='<div class="modal-card"><div class="modal-head"><h2>إضافة مشروع</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field"><label>رقم</label><input id="f_serial"></div><div class="field full"><label>اسم المشروع</label><input id="f_name"></div><div class="field"><label>الجهة الحكومية</label><input id="f_entity"></div><div class="field"><label>حالة المشروع</label><input id="f_status" value="قيد التنفيذ"></div><div class="field"><label>قطاع العمل</label><input id="f_sector"></div><div class="field"><label>قيمة المشروع</label><input id="f_value" type="number"></div><div class="field"><label>نسبة الإنجاز %</label><input id="f_progress" type="number"></div><div class="field"><label>تاريخ البدء</label><input id="f_start" type="date"></div><div class="field"><label>تاريخ الانتهاء</label><input id="f_end" type="date"></div></div><button class="btn primary" onclick="saveProject()">حفظ</button></div>';modal.classList.remove('hidden')}
async function saveProject(){let en=f_entity.value.trim();if(en){await db.from('government_entities').upsert({name:en},{onConflict:'name'});};const er=await db.from('government_entities').select('id').eq('name',en).single();const r=await db.from('projects').insert({serial_no:Number(f_serial.value)||null,government_entity_id:er.data?.id,project_name:f_name.value.trim(),project_status:f_status.value,work_sector:f_sector.value,total_project_value:Number(f_value.value)||0,progress_pct:Number(f_progress.value)||0,start_date:f_start.value||null,end_date:f_end.value||null}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();toast('تم حفظ المشروع')}
function renderEntities(){db.from('government_entities').select('*').order('name').then(r=>{document.getElementById('page-entities').innerHTML='<div class="panel"><h2>الجهات الحكومية</h2><div class="table-wrap"><table><thead><tr><th>الجهة</th><th>الرمز</th></tr></thead><tbody>'+((r.data||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.code)+'</td></tr>').join(''))+'</tbody></table></div></div>'})}
function renderCompanies(){db.from('companies').select('*').order('name').then(r=>{document.getElementById('page-companies').innerHTML='<div class="panel"><h2>الشركات</h2><div class="table-wrap"><table><thead><tr><th>الشركة</th><th>النوع</th></tr></thead><tbody>'+((r.data||[]).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.company_type)+'</td></tr>').join(''))+'</tbody></table></div></div>'})}
function renderReports(){document.getElementById('page-reports').innerHTML='<div class="panel"><div class="toolbar"><h2>التقارير الربع سنوية</h2><button class="btn primary" onclick="openReport()">إضافة تقرير</button></div><div class="table-wrap"><table><thead><tr><th>المشروع</th><th>الربع</th><th>السنة</th><th>الحالة</th><th>تاريخ الاستلام</th></tr></thead><tbody>'+reports.map(r=>'<tr><td>'+esc(r.projects?.project_name)+'</td><td>'+esc(r.quarter)+'</td><td>'+esc(r.annual_period)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.submitted_at)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function openReport(){modal.innerHTML='<div class="modal-card"><div class="modal-head"><h2>إضافة تقرير ربع سنوي</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>المشروع</label><select id="r_project">'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_name)+'</option>').join('')+'</select></div><div class="field"><label>الربع</label><input id="r_q" placeholder="Q1"></div><div class="field"><label>السنة</label><input id="r_y" placeholder="Year1"></div><div class="field"><label>تاريخ الاستلام</label><input id="r_date" type="date"></div><div class="field full"><label>ملاحظات</label><textarea id="r_notes"></textarea></div></div><button class="btn primary" onclick="saveReport()">حفظ</button></div>';modal.classList.remove('hidden')}
async function saveReport(){const r=await db.from('quarterly_reports').insert({project_id:r_project.value,quarter:r_q.value,annual_period:r_y.value,submitted_at:r_date.value||null,notes:r_notes.value,created_by:session.user.id}).select().single();if(r.error)return toast(r.error.message);closeModal();await loadAll();toast('تم حفظ التقرير')}
function renderPlans(){document.getElementById('page-plans').innerHTML='<div class="panel"><div class="toolbar"><h2>خطط المحتوى المحلي</h2><button class="btn primary" onclick="openPlan()">إضافة خطة</button></div><div class="table-wrap"><table><thead><tr><th>المشروع</th><th>الإصدار</th><th>الحالة</th><th>المصدر</th></tr></thead><tbody>'+plans.map(r=>'<tr><td>'+esc(r.projects?.project_name)+'</td><td>'+esc(r.version)+'</td><td>'+esc(r.status)+'</td><td>'+esc(r.source_file)+'</td></tr>').join('')+'</tbody></table></div></div>'}
function openPlan(){modal.innerHTML='<div class="modal-card"><div class="modal-head"><h2>إضافة خطة محتوى محلي</h2><button class="close" onclick="closeModal()">×</button></div><div class="form-grid"><div class="field full"><label>المشروع</label><select id="pl_project">'+projects.map(p=>'<option value="'+p.id+'">'+esc(p.project_name)+'</option>').join('')+'</select></div><div class="field"><label>الإصدار</label><input id="pl_ver"></div><div class="field"><label>المصدر</label><input id="pl_source"></div><div class="field"><label>الحالة</label><select id="pl_status"><option>received</option><option>reviewed</option><option>approved</option></select></div></div><button class="btn primary" onclick="savePlan()">حفظ</button></div>';modal.classList.remove('hidden')}
async function savePlan(){const r=await db.from('local_content_plans').insert({project_id:pl_project.value,version:pl_ver.value,source_file:pl_source.value,status:pl_status.value,created_by:session.user.id});if(r.error)return toast(r.error.message);closeModal();await loadAll();toast('تم حفظ الخطة')}
function renderFollowups(){document.getElementById('page-followups').innerHTML='<div class="panel"><h2>متابعة الموظفين</h2><p class="muted">هذه الصفحة جاهزة لتسجيل المهام والتنبيهات المرتبطة بالمشاريع والتقارير.</p></div>'}
async function renderAudit(){const e=document.getElementById('page-audit');if(profile?.role!=='admin'){e.innerHTML='<div class="panel"><h2>سجل التدقيق</h2><p class="muted">هذه الصفحة متاحة لمسؤول النظام فقط.</p></div>';return}const r=await db.from('audit_log').select('*').order('changed_at',{ascending:false}).limit(100);e.innerHTML='<div class="panel"><h2>سجل التدقيق</h2><div class="table-wrap"><table><thead><tr><th>العملية</th><th>الجدول</th><th>السجل</th><th>التاريخ</th></tr></thead><tbody>'+((r.data||[]).map(x=>'<tr><td>'+esc(x.operation)+'</td><td>'+esc(x.table_name)+'</td><td>'+esc(x.record_id)+'</td><td>'+esc(x.changed_at)+'</td></tr>').join(''))+'</tbody></table></div></div>'}
function exportProjects(){const rows=projects.map(p=>({'م':p.serial_no,'الجهة الحكومية':p.government_entities?.name,'اسم المشروع':p.project_name,'حالة المشروع':p.project_status,'قيمة المشروع الاجمالي':p.total_project_value,'نسبة الانجاز':p.progress_pct,'إجمالي الصرف':p.total_spend,'إجمالي المحتوى المحلي':p.total_local_content,'نسبة المحتوى المحلي إلى إجمالي الصرف':p.local_content_spend_pct,'نسبة المحتوى المحلي إلى قيمة المشروع':p.local_content_project_pct,'نسبة SME':p.sme_pct,'الملاحظات':p.notes}));const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'المشاريع');XLSX.writeFile(wb,'ICV-New-Projects.xlsx')}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
db.auth.getSession().then(r=>boot(r.data.session));db.auth.onAuthStateChange((_,s)=>{if(s&&!session)boot(s)})
