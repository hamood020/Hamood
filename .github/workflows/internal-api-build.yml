name: Internal API build

on:
  push:
    branches:
      - internal-sqlserver-api-work
    paths:
      - "backend/Icv.Api/**"
      - ".github/workflows/internal-api-build.yml"
  pull_request:
    branches:
      - internal-sqlserver-api-work
    paths:
      - "backend/Icv.Api/**"
      - ".github/workflows/internal-api-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/Icv.Api/Icv.Api.csproj
      - name: Build
        run: dotnet build backend/Icv.Api/Icv.Api.csproj --configuration Release --no-restore
