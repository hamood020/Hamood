name: Validate contract module
on:
  push:
    branches: [feature/contracts-indicators-foundation]
    paths:
      - "public/index.html"
      - "public/icv-contracts.js"
      - "public/icv-i18n.js"
      - "supabase/migrations/**"
      - "supabase/tests/contracts/**"
      - ".github/workflows/validate-contracts.yml"
  pull_request:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/icv-contracts.js"
      - "public/icv-i18n.js"
      - "supabase/migrations/**"
      - "supabase/tests/contracts/**"
      - ".github/workflows/validate-contracts.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax and route wiring
        run: node supabase/tests/contracts/check-contracts-ui.cjs
      - name: Prepare a disposable Supabase schema replica
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/contracts/00_platform_stubs.sql
      - name: Apply migration to the disposable database only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261022120000_contracts_and_indicators_foundation.sql
      - name: Assert tables, grants, RLS, approvals, line items and audit
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/contracts/01_assertions.sql
